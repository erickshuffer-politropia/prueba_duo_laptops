<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — prueba_duo_laptops</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">

    <!-- Pantalla 1: formulario -->
    <section id="login-view" class="card">
      <header class="card-head">
        <h1>Iniciar sesión</h1>
        <p class="sub">Frontend servido desde el PC Windows</p>
      </header>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="erick" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
                 placeholder="••••••••" required>
        </div>

        <p id="error" class="error" role="alert" hidden></p>

        <button id="submit" type="submit" class="btn">
          <span class="btn-label">Entrar</span>
          <span class="spinner" hidden></span>
        </button>
      </form>

      <footer class="card-foot">
        <span class="dot" id="api-dot"></span>
        <code id="api-label"></code>
      </footer>
    </section>

    <!-- Pantalla 2: éxito -->
    <section id="success-view" class="card success" hidden>
      <div class="check">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M15 27 l8 8 l15 -16" fill="none" stroke="currentColor"
                stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1>¡Bienvenido!</h1>
      <p class="sub">Sesión iniciada como <strong id="who"></strong></p>

      <dl class="meta">
        <dt>Token</dt>
        <dd><code id="token"></code></dd>
        <dt>Validado por</dt>
        <dd>Backend en el MacBook</dd>
      </dl>

      <button id="logout" type="button" class="btn ghost">Cerrar sesión</button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
